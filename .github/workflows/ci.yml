name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Üretim paketinde gizli bilgi / mock verisi olmadığını doğrula
        run: |
          ! grep -rE "EXAM_TOKEN_SECRET|private_key|ykds_mock_db" dist/
